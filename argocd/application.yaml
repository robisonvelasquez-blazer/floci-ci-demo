apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: floci-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/robisonvelasquez-blazer/floci-ci-demo.git
    targetRevision: main
    path: helm/floci-demo
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: floci-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
