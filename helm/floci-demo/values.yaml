replicaCount: 2

image:
  repository: robisonvelasquez/floci-demo # Reemplazar por tu usuario real de DockerHub
  pullPolicy: IfNotPresent
  tag: "initial-commit-sha" # GitHub Actions sobrescribe este valor con ${{ github.sha }}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080 # Coincide con EXPOSE 8080 y http.ListenAndServe(":8080") en main.go

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

env:
  - name: AWS_REGION
    value: "us-east-1"
